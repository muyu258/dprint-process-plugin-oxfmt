name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize checkout line endings
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          git checkout-index --force --all

      - name: Set up project toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Run full checks
        run: just ci
