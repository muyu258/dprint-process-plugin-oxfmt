[package]
name = "dprint-process-plugin-oxfmt"
version = "0.63.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
dprint-core = { version = "=0.68.2", default-features = false, features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "process", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
